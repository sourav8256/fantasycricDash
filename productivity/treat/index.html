<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treat Yourself</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Light bg */
            color: #0f172a;
            /* Dark text */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .animate-enter {
            animation: enter 0.3s ease-out forwards;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 max-w-4xl mx-auto">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-cyan-600">
                Treat Reward System
            </h1>
            <p class="text-slate-500 mt-1">Earn your rewards, one step at a time.</p>
        </div>

        <div class="glass-panel rounded-2xl p-4 flex items-center gap-6 shadow-sm border border-slate-200">
            <div class="border-r border-slate-200 pr-6 mr-2">
                <span class="block text-xs text-slate-500 uppercase tracking-wider font-semibold">Income Rate</span>
                <div class="flex items-center gap-2 cursor-pointer group" onclick="app.setRate()">
                    <span id="rateDisplay" class="text-xl font-bold text-slate-700">0</span>
                    <span class="text-xs text-slate-400 font-medium whitespace-nowrap">pts/min</span>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4 text-slate-300 group-hover:text-brand-500 transition-colors" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </div>
            </div>
            <div>
                <span class="block text-xs text-slate-500 uppercase tracking-wider font-semibold">Current Balance</span>
                <span id="balanceDisplay" class="text-3xl font-bold text-brand-600">0</span>
                <span class="text-sm text-slate-500">pts</span>
            </div>
            <button onclick="app.addPoints()"
                class="bg-brand-600 hover:bg-brand-500 text-white p-3 rounded-full transition-all shadow-md hover:shadow-lg active:scale-95 group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:rotate-90 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Create Reward -->
    <section class="mb-12 glass-panel rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200">
        <h2 class="text-xl font-semibold mb-6 flex items-center gap-2 text-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Add New Reward
        </h2>

        <form id="addRewardForm" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
            <div class="md:col-span-5 space-y-2">
                <label class="text-sm font-medium text-slate-500">Reward Name</label>
                <input type="text" id="rewardName" required placeholder="e.g. 15 mins Gaming"
                    class="w-full bg-slate-50 border-slate-200 text-slate-900 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all placeholder:text-slate-400 border shadow-sm">
            </div>

            <div class="md:col-span-3 space-y-2">
                <label class="text-sm font-medium text-slate-500">Type</label>
                <select id="rewardType" onchange="app.toggleInputType()"
                    class="w-full bg-slate-50 border-slate-200 text-slate-900 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all border shadow-sm">
                    <option value="cost">Cost (Points)</option>
                    <option value="time">Time Wait (Mins)</option>
                </select>
            </div>

            <div class="md:col-span-2 space-y-2">
                <label id="valueLabel" class="text-sm font-medium text-slate-500">Cost</label>
                <input type="number" id="rewardValue" required min="1" placeholder="100"
                    class="w-full bg-slate-50 border-slate-200 text-slate-900 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all border shadow-sm">
            </div>

            <div class="md:col-span-2">
                <button type="submit"
                    class="w-full bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-semibold py-3 px-6 rounded-xl transition-all transform hover:-translate-y-0.5 shadow-md">
                    Add
                </button>
            </div>
        </form>
    </section>

    <!-- Rate Modal -->
    <div id="rateModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity opacity-0"
            id="rateModalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform scale-90 opacity-0 transition-all border border-slate-100"
                id="rateModalContent">
                <h3 class="text-lg font-bold text-slate-800 mb-2">Set Income Rate</h3>
                <p class="text-sm text-slate-500 mb-6">How many points should be generated per minute automatically?</p>

                <form onsubmit="app.saveRate(event)">
                    <div class="mb-6">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Points /
                            Minute</label>
                        <input type="number" id="rateInput" required min="0" step="any" placeholder="e.g. 60"
                            oninput="app.updateProjections()"
                            class="w-full text-2xl font-bold text-slate-700 border-b-2 border-slate-200 focus:border-brand-500 outline-none py-2 bg-transparent transition-colors placeholder:text-slate-300">
                    </div>

                    <div class="bg-slate-50 rounded-xl p-4 mb-6 grid grid-cols-2 gap-4 border border-slate-100">
                        <div>
                            <span
                                class="block text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Weekly</span>
                            <span id="projWeekly" class="block text-lg font-bold text-brand-600">0</span>
                        </div>
                        <div>
                            <span
                                class="block text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Monthly</span>
                            <span id="projMonthly" class="block text-lg font-bold text-cyan-600">0</span>
                        </div>
                    </div>

                    <div class="flex gap-3 justify-end">
                        <button type="button" onclick="app.closeRateModal()"
                            class="px-4 py-2 text-slate-500 hover:text-slate-700 font-medium transition-colors">Cancel</button>
                        <button type="submit"
                            class="px-6 py-2 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all active:scale-95">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Rewards List -->
    <main>
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold text-slate-800">Your Rewards</h2>
            <button onclick="app.clearAll()"
                class="text-xs text-red-500 hover:text-red-400 transition-colors uppercase tracking-wider font-semibold">Reset
                All</button>
        </div>

        <div id="rewardsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items will be injected here -->
        </div>

        <div id="emptyState" class="hidden text-center py-20 opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 text-slate-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <p>No rewards yet. Add one above!</p>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'treat_app_data';

        class TreatApp {
            constructor() {
                this.state = this.loadState();
                this.init();
            }

            loadState() {
                const saved = localStorage.getItem(STORAGE_KEY);
                let state = saved ? JSON.parse(saved) : { balance: 0, rewards: [], rate: 0, lastUpdated: Date.now() };

                // Migrations / Defaults
                if (state.rate === undefined) state.rate = 0;
                if (state.lastUpdated === undefined) state.lastUpdated = Date.now();

                // Calculate offline income
                const now = Date.now();
                const minutesPassed = (now - state.lastUpdated) / 60000;

                if (state.rate > 0 && minutesPassed > 0) {
                    const generated = minutesPassed * state.rate;
                    state.balance += generated;
                    if (generated > 1) {
                        // Optional: could show a toast here "You earned X points while away"
                        console.log(`Generated ${generated.toFixed(1)} points while away`);
                    }
                }

                state.lastUpdated = now;
                return state;
            }

            saveState() {
                this.state.lastUpdated = Date.now();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                this.render(); // Ensure UI reflects state
            }

            init() {
                // DOM Elements
                this.balanceDisplay = document.getElementById('balanceDisplay');
                this.rateDisplay = document.getElementById('rateDisplay');
                this.rewardsList = document.getElementById('rewardsList');
                this.emptyState = document.getElementById('emptyState');
                this.form = document.getElementById('addRewardForm');

                // Event Listeners
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addReward();
                });

                // Ticker for time-based rewards AND passive income
                setInterval(() => {
                    this.tick();
                }, 1000);

                // Save on visibility change to capture accurate lastUpdated
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        this.saveState();
                    }
                });

                this.render();
            }

            tick() {
                this.updateTimers();

                // Passive Income
                if (this.state.rate > 0) {
                    const pointsPerSecond = this.state.rate / 60;
                    this.state.balance += pointsPerSecond;
                    // We render balance update immediately for smooth effect
                    this.renderBalance();
                }
            }

            toggleInputType() {
                const type = document.getElementById('rewardType').value;
                const label = document.getElementById('valueLabel');
                const input = document.getElementById('rewardValue');

                if (type === 'cost') {
                    label.textContent = 'Cost (Points)';
                    input.placeholder = '100';
                } else {
                    label.textContent = 'Wait Time (Mins)';
                    input.placeholder = '30';
                }
            }

            setRate() {
                const modal = document.getElementById('rateModal');
                const backdrop = document.getElementById('rateModalBackdrop');
                const content = document.getElementById('rateModalContent');
                const input = document.getElementById('rateInput');

                input.value = this.state.rate || '';
                this.updateProjections(); // Init values

                modal.classList.remove('hidden');
                // Small delay for transition
                requestAnimationFrame(() => {
                    backdrop.classList.remove('opacity-0');
                    content.classList.remove('scale-90', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                    input.focus();
                });
            }

            updateProjections() {
                const input = document.getElementById('rateInput');
                const rate = parseFloat(input.value) || 0;

                const weekly = rate * 60 * 24 * 7;
                const monthly = rate * 60 * 24 * 30;

                document.getElementById('projWeekly').textContent = weekly.toLocaleString();
                document.getElementById('projMonthly').textContent = monthly.toLocaleString();
            }

            closeRateModal() {
                const modal = document.getElementById('rateModal');
                const backdrop = document.getElementById('rateModalBackdrop');
                const content = document.getElementById('rateModalContent');

                backdrop.classList.add('opacity-0');
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-90', 'opacity-0');

                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300); // Match transition duration
            }

            saveRate(e) {
                e.preventDefault();
                const input = document.getElementById('rateInput');
                const rate = parseFloat(input.value);

                if (!isNaN(rate) && rate >= 0) {
                    this.state.rate = rate;
                    this.saveState();
                    this.closeRateModal();
                }
            }

            addPoints() {
                const amount = prompt("Enter points to add:", "100");
                if (amount && !isNaN(amount)) {
                    this.state.balance += parseInt(amount);
                    this.saveState();
                }
            }

            addReward() {
                const name = document.getElementById('rewardName').value;
                const type = document.getElementById('rewardType').value;
                const value = parseInt(document.getElementById('rewardValue').value);

                const reward = {
                    id: Date.now(),
                    name,
                    type,
                    value, // Cost or Duration in minutes
                    createdAt: Date.now(),
                    unlockedAt: type === 'time' ? Date.now() + (value * 60 * 1000) : null
                };

                this.state.rewards.unshift(reward); // Add to top
                this.saveState();
                this.form.reset();
                this.toggleInputType(); // Reset label
            }

            removeReward(id) {
                if (confirm('Delete this reward?')) {
                    this.state.rewards = this.state.rewards.filter(r => r.id !== id);
                    this.saveState();
                }
            }

            redeemReward(id) {
                const reward = this.state.rewards.find(r => r.id === id);
                if (!reward) return;

                if (reward.type === 'cost') {
                    if (this.state.balance >= reward.value) {
                        if (confirm(`Redeem "${reward.name}" for ${reward.value} points?`)) {
                            this.state.balance -= reward.value;
                            this.saveState();
                            alert(`Enjoy your ${reward.name}!`);
                        }
                    }
                } else {
                    // Time based
                    if (Date.now() >= reward.unlockedAt) {
                        alert(`Enjoy your ${reward.name}!`);
                        if (confirm("Reset timer to earn this again? Cancel to delete.")) {
                            reward.unlockedAt = Date.now() + (reward.value * 60 * 1000);
                            this.saveState();
                        } else {
                            this.state.rewards = this.state.rewards.filter(r => r.id !== id);
                            this.saveState();
                        }
                    }
                }
            }

            clearAll() {
                if (confirm("Clear all data? This cannot be undone.")) {
                    this.state = { balance: 0, rewards: [], rate: 0, lastUpdated: Date.now() };
                    this.saveState();
                }
            }

            updateTimers() {
                const now = Date.now();
                let hasChanges = false;

                this.state.rewards.forEach(reward => {
                    if (reward.type === 'time') {
                        const el = document.getElementById(`timer-${reward.id}`);
                        const btn = document.getElementById(`btn-${reward.id}`);
                        if (el && btn) {
                            const timeLeft = reward.unlockedAt - now;
                            if (timeLeft <= 0) {
                                if (el.innerText !== 'Ready!') {
                                    el.innerHTML = '<span class="text-brand-600 font-bold">Ready!</span>';
                                    btn.disabled = false;
                                    btn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-200', 'text-slate-400');
                                    btn.classList.add('bg-brand-600', 'text-white', 'hover:bg-brand-500');
                                }
                            } else {
                                const minutes = Math.floor(timeLeft / 60000);
                                const seconds = Math.floor((timeLeft % 60000) / 1000);
                                el.innerHTML = `<span class="font-mono text-slate-600">${minutes}m ${seconds}s</span> until ready`;
                            }
                        }
                    }
                });
            }

            renderBalance() {
                if (this.balanceDisplay) {
                    this.balanceDisplay.textContent = Math.floor(this.state.balance);
                }
            }

            render() {
                this.renderBalance();
                if (this.rateDisplay) {
                    this.rateDisplay.textContent = this.state.rate;
                }

                if (this.state.rewards.length === 0) {
                    if (this.rewardsList) this.rewardsList.innerHTML = '';
                    if (this.emptyState) this.emptyState.classList.remove('hidden');
                    return;
                }

                if (this.emptyState) this.emptyState.classList.add('hidden');

                if (this.rewardsList) {
                    this.rewardsList.innerHTML = this.state.rewards.map(reward => {
                        let statusHtml = '';
                        let buttonState = '';

                        if (reward.type === 'cost') {
                            const canAfford = this.state.balance >= reward.value;
                            const progress = Math.min((this.state.balance / reward.value) * 100, 100);

                            if (canAfford) {
                                buttonState = 'class="w-full py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-colors shadow-sm"';
                            } else {
                                buttonState = 'disabled class="w-full py-2 rounded-lg bg-slate-200 text-slate-400 font-medium cursor-not-allowed"';
                            }

                            statusHtml = `
                                <div class="space-y-2">
                                    <div class="flex justify-between text-sm text-slate-500">
                                        <span>${reward.value} pts</span>
                                        <span>${Math.round(progress)}%</span>
                                    </div>
                                    <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                                        <div class="h-full bg-brand-500 transition-all duration-500" style="width: ${progress}%"></div>
                                    </div>
                                </div>
                            `;
                        } else {
                            const timeLeft = reward.unlockedAt - Date.now();
                            const isReady = timeLeft <= 0;

                            if (isReady) {
                                buttonState = 'class="w-full py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-colors shadow-sm"';
                            } else {
                                buttonState = 'disabled class="w-full py-2 rounded-lg bg-slate-200 text-slate-400 font-medium cursor-not-allowed"';
                            }

                            statusHtml = `
                                <div class="text-sm text-slate-500 flex items-center gap-2" id="timer-${reward.id}">
                                    ${isReady ? '<span class="text-brand-600 font-bold">Ready!</span>' : 'Calculating...'}
                                </div>
                            `;
                        }

                        return `
                            <div class="glass-panel rounded-xl p-5 animate-enter relative group hover:shadow-md transition-shadow bg-white border border-slate-200">
                                <button onclick="app.removeReward(${reward.id})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                
                                <div class="flex items-start justify-between mb-4">
                                    <div>
                                        <span class="inline-block px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wide mb-2 ${reward.type === 'cost' ? 'bg-cyan-100 text-cyan-800' : 'bg-purple-100 text-purple-800'}">
                                            ${reward.type === 'cost' ? 'Points' : 'Timer'}
                                        </span>
                                        <h3 class="text-lg font-bold text-slate-800 leading-tight">${reward.name}</h3>
                                    </div>
                                </div>
    
                                <div class="mb-6">
                                    ${statusHtml}
                                </div>
    
                                <button id="btn-${reward.id}" onclick="app.redeemReward(${reward.id})" ${buttonState}>
                                    Redeem
                                </button>
                            </div>
                        `;
                    }).join('');

                    this.updateTimers();
                }
            }
        }

        const app = new TreatApp();
    </script>
</body>

</html>
