<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronicle | Your Personal Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --header-bg: rgba(15, 23, 42, 0.6);
            --modal-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --accent-primary: #4f46e5;
            --accent-secondary: #9333ea;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-dim: #64748b;
            --header-bg: rgba(248, 250, 252, 0.8);
            --modal-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(129, 140, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: var(--header-bg);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-btn, .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.6rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover, .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem;
            padding-bottom: 5rem;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .diary-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.25rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .diary-card:focus-within {
            border-color: rgba(129, 140, 248, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            align-items: center;
        }

        .date-label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--accent-primary);
        }

        .day-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
        }

        .diary-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            resize: none;
            outline: none;
            min-height: 100px;
            padding: 0;
            line-height: 1.6;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-family: var(--font-display);
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.8rem;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
        }

        .close-btn {
            width: 100%;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s ease;
        }

        .close-btn:active {
            transform: scale(0.98);
        }

        /* Utility */
        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 3rem 1rem;
        }

        /* Pattern Lock Styles */
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .lock-overlay.active {
            display: flex;
        }

        .lock-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lock-status {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            height: 1.5rem;
        }

        #patternCanvas {
            cursor: pointer;
            touch-action: none;
        }

        .blurred {
            filter: blur(40px) brightness(0.7);
            pointer-events: none;
            user-select: none;
            transition: filter 0.3s ease;
        }

        .privacy-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .btn-secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 12px;
            width: 100%;
            margin-top: 0.5rem;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 480px) {
            header { padding: 1rem; }
            main { padding: 1rem; }
            .diary-card { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Chronicle</h1>
        <div class="header-actions">
            <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="settings-btn" id="openSettings" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>
    </header>

    <main>
        <div class="timeline" id="timeline">
            <!-- Diary cards will be injected here -->
        </div>
    </main>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="form-group">
                <label for="retentionDays">Retention Period (Days)</label>
                <input type="number" id="retentionDays" min="1" max="3650" value="30">
                <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem;">
                    Entries older than this will be automatically removed.
                </p>
            </div>

            <div class="privacy-section">
                <h3>Privacy</h3>
                <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 1rem;">
                    Lock your diary with a pattern. It will auto-lock when you leave the app.
                </p>
                <button class="btn-secondary" id="setPatternBtn">Set New Pattern</button>
                <button class="btn-secondary btn-danger" id="clearPatternBtn" style="display: none;">Remove Pattern</button>
            </div>

            <button class="close-btn" id="closeSettings">Save & Close</button>
        </div>
    </div>

    <!-- Pattern Lock Overlay -->
    <div class="lock-overlay" id="lockOverlay">
        <h2 class="lock-title">Chronicle Locked</h2>
        <div class="lock-status" id="lockStatus">Draw your pattern to unlock</div>
        <canvas id="patternCanvas" width="300" height="300"></canvas>
        <button class="btn-secondary" id="cancelPattern" style="width: auto; padding: 0.6rem 2rem; margin-top: 2rem; display: none;">Cancel</button>
    </div>

    <script>
        const timeline = document.getElementById('timeline');
        const settingsModal = document.getElementById('settingsModal');
        const retentionInput = document.getElementById('retentionDays');
        
        // --- State Management ---
        let state = {
            entries: JSON.parse(localStorage.getItem('chronicle_entries') || '{}'),
            settings: JSON.parse(localStorage.getItem('chronicle_settings') || '{"retention": 30, "theme": "dark", "pattern": null}'),
            isLocked: false,
            isSettingPattern: false,
            tempPattern: null
        };

        const applyTheme = () => {
            document.documentElement.setAttribute('data-theme', state.settings.theme);
            const icon = document.getElementById('themeIcon');
            if (state.settings.theme === 'light') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
            }
        };

        const saveState = () => {
            localStorage.setItem('chronicle_entries', JSON.stringify(state.entries));
            localStorage.setItem('chronicle_settings', JSON.stringify(state.settings));
        };

        // --- Date Utilities ---
        const formatDateKey = (date) => {
            return date.toISOString().split('T')[0];
        };

        const getDisplayDate = (date) => {
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            if (formatDateKey(date) === formatDateKey(today)) return 'Today';
            if (formatDateKey(date) === formatDateKey(yesterday)) return 'Yesterday';

            return date.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        const getDayName = (date) => {
            return date.toLocaleDateString('en-US', { weekday: 'long' });
        };

        // --- Core Logic ---
        const pruneEntries = () => {
            const today = new Date();
            const retentionLimit = new Date();
            retentionLimit.setDate(today.getDate() - state.settings.retention);
            const limitKey = formatDateKey(retentionLimit);

            let pruned = false;
            Object.keys(state.entries).forEach(key => {
                if (key < limitKey) {
                    delete state.entries[key];
                    pruned = true;
                }
            });
            if (pruned) saveState();
        };

        const renderTimeline = () => {
            timeline.innerHTML = '';
            const today = new Date();
            
            for (let i = 0; i < state.settings.retention; i++) {
                const date = new Date();
                date.setDate(today.getDate() - i);
                const key = formatDateKey(date);
                
                const card = document.createElement('div');
                card.className = 'diary-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="date-label">${getDisplayDate(date)}</span>
                        <span class="day-label">${getDayName(date)}</span>
                    </div>
                    <textarea 
                        class="diary-input" 
                        placeholder="Write your thoughts..." 
                        data-key="${key}"
                    >${state.entries[key] || ''}</textarea>
                `;
                
                const textarea = card.querySelector('textarea');
                
                // Auto-expand textarea
                textarea.addEventListener('input', (e) => {
                    e.target.style.height = 'auto';
                    e.target.style.height = (e.target.scrollHeight) + 'px';
                    
                    // Save on every input
                    state.entries[key] = e.target.value;
                    saveState();
                });

                // Initial height adjustment
                setTimeout(() => {
                    textarea.style.height = 'auto';
                    textarea.style.height = (textarea.scrollHeight) + 'px';
                }, 0);

                timeline.appendChild(card);
            }
        };

        // --- UI Interactions ---
        document.getElementById('themeToggle').onclick = () => {
            state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
            saveState();
            applyTheme();
        };

        document.getElementById('openSettings').onclick = () => {
            retentionInput.value = state.settings.retention;
            settingsModal.classList.add('active');
        };

        document.getElementById('closeSettings').onclick = () => {
            const newVal = parseInt(retentionInput.value);
            if (newVal > 0) {
                state.settings.retention = newVal;
                saveState();
                pruneEntries();
                renderTimeline();
            }
            settingsModal.classList.remove('active');
        };

        // Close on background click
        settingsModal.onclick = (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('active');
        };

        // --- Pattern Lock Engine ---
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const lockOverlay = document.getElementById('lockOverlay');
        const lockStatus = document.getElementById('lockStatus');
        const setPatternBtn = document.getElementById('setPatternBtn');
        const clearPatternBtn = document.getElementById('clearPatternBtn');
        const cancelPatternBtn = document.getElementById('cancelPattern');

        const dots = [];
        const dotRadius = 8;
        const gridGap = 80;
        const margin = 70;
        let activePattern = [];
        let isDrawing = false;

        // Initialize grid
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                dots.push({
                    x: margin + j * gridGap,
                    y: margin + i * gridGap,
                    id: i * 3 + j
                });
            }
        }

        const drawGrid = (mousePos = null) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw lines
            if (activePattern.length > 0) {
                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = state.settings.theme === 'light' ? '#4f46e5' : '#818cf8';
                
                const firstDot = dots[activePattern[0]];
                ctx.moveTo(firstDot.x, firstDot.y);
                
                for (let i = 1; i < activePattern.length; i++) {
                    const dot = dots[activePattern[i]];
                    ctx.lineTo(dot.x, dot.y);
                }
                
                if (mousePos && isDrawing) {
                    ctx.lineTo(mousePos.x, mousePos.y);
                }
                ctx.stroke();
            }

            // Draw dots
            dots.forEach(dot => {
                const isActive = activePattern.includes(dot.id);
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dotRadius, 0, Math.PI * 2);
                ctx.fillStyle = isActive ? (state.settings.theme === 'light' ? '#4f46e5' : '#818cf8') : 'rgba(255,255,255,0.2)';
                if (state.settings.theme === 'light' && !isActive) ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fill();
                
                if (isActive) {
                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, dotRadius * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(129, 140, 248, 0.15)';
                    ctx.fill();
                }
            });
        };

        const getMousePos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const handleStart = (e) => {
            isDrawing = true;
            activePattern = [];
            handleMove(e);
        };

        const handleMove = (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            
            dots.forEach(dot => {
                const dist = Math.hypot(dot.x - pos.x, dot.y - pos.y);
                if (dist < 30 && !activePattern.includes(dot.id)) {
                    activePattern.push(dot.id);
                    if (window.navigator.vibrate) window.navigator.vibrate(20);
                }
            });
            drawGrid(pos);
        };

        const handleEnd = () => {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (activePattern.length < 4) {
                if (activePattern.length > 0) {
                    lockStatus.innerText = 'Pattern too short (min 4 dots)';
                    lockStatus.style.color = '#ef4444';
                    setTimeout(() => {
                        lockStatus.innerText = state.isSettingPattern ? (state.tempPattern ? 'Draw again to confirm' : 'Draw your new pattern') : 'Draw your pattern to unlock';
                        lockStatus.style.color = '';
                    }, 1500);
                }
                activePattern = [];
                drawGrid();
                return;
            }

            const patternStr = activePattern.join('');
            
            if (state.isSettingPattern) {
                if (!state.tempPattern) {
                    state.tempPattern = patternStr;
                    lockStatus.innerText = 'Draw again to confirm';
                    activePattern = [];
                    drawGrid();
                } else {
                    if (patternStr === state.tempPattern) {
                        state.settings.pattern = patternStr;
                        saveState();
                        state.isSettingPattern = false;
                        state.tempPattern = null;
                        unlockApp();
                        updatePrivacyUI();
                    } else {
                        lockStatus.innerText = 'Patterns do not match. Try again.';
                        lockStatus.style.color = '#ef4444';
                        state.tempPattern = null; activePattern = [];
                        setTimeout(() => {
                            lockStatus.innerText = 'Draw your new pattern';
                            lockStatus.style.color = '';
                            drawGrid();
                        }, 1500);
                    }
                }
            } else {
                if (patternStr === state.settings.pattern) {
                    unlockApp();
                } else {
                    lockStatus.innerText = 'Incorrect pattern';
                    lockStatus.style.color = '#ef4444';
                    activePattern = [];
                    drawGrid();
                    setTimeout(() => {
                        lockStatus.innerText = 'Draw your pattern to unlock';
                        lockStatus.style.color = '';
                    }, 1500);
                }
            }
        };

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('touchend', handleEnd);

        const lockApp = () => {
            if (!state.settings.pattern) return;
            state.isLocked = true;
            document.querySelector('header').classList.add('blurred');
            document.querySelector('main').classList.add('blurred');
            lockOverlay.classList.add('active');
            lockStatus.innerText = 'Draw your pattern to unlock';
            activePattern = [];
            drawGrid();
        };

        const unlockApp = () => {
            state.isLocked = false;
            document.querySelector('header').classList.remove('blurred');
            document.querySelector('main').classList.remove('blurred');
            lockOverlay.classList.remove('active');
            cancelPatternBtn.style.display = 'none';
        };

        const updatePrivacyUI = () => {
            if (state.settings.pattern) {
                setPatternBtn.innerText = 'Change Pattern';
                clearPatternBtn.style.display = 'block';
            } else {
                setPatternBtn.innerText = 'Set Pattern';
                clearPatternBtn.style.display = 'none';
            }
        };

        setPatternBtn.onclick = () => {
            state.isSettingPattern = true;
            state.tempPattern = null;
            activePattern = [];
            lockOverlay.classList.add('active');
            cancelPatternBtn.style.display = 'block';
            lockStatus.innerText = 'Draw your new pattern';
            settingsModal.classList.remove('active');
            drawGrid();
        };

        cancelPatternBtn.onclick = () => {
            state.isSettingPattern = false;
            state.tempPattern = null;
            lockOverlay.classList.remove('active');
        };

        clearPatternBtn.onclick = () => {
            if (confirm('Are you sure you want to remove the pattern lock?')) {
                state.settings.pattern = null;
                saveState();
                updatePrivacyUI();
            }
        };

        // --- Event Listeners ---
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && state.settings.pattern) {
                lockApp();
            }
        });

        // Initialize state-dependent UI
        updatePrivacyUI();
        if (state.settings.pattern) lockApp();

        applyTheme();
        pruneEntries();
        renderTimeline();

    </script>
</body>
</html>
