        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141937;
            --bg-card: rgba(30, 35, 64, 0.6);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-tertiary: #ec4899;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .search-container {
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .recent-apps-section {
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .recent-title {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clear-history-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .clear-history-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
        }

        .recent-apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .recent-app-card {
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .recent-app-card:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .recent-app-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .recent-app-info {
            flex: 1;
            min-width: 0;
        }

        .recent-app-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-app-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .empty-recent {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .category-icon {
            font-size: 1.5rem;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
        }

        .link-card:hover::before {
            transform: scaleX(1);
        }

        .link-card:active {
            transform: translateY(-2px);
        }

        .link-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .link-card:hover .link-icon {
            transform: rotate(5deg) scale(1.1);
        }

        .link-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .link-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .links-grid {

            }

            .stats-bar {
                gap: 1rem;
            }

            .stat-item {
                padding: 0.75rem 1.5rem;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

                const stored = localStorage.getItem(RECENT_APPS_KEY);
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Error loading recent apps:', e);
                return [];
            }
        }

        function saveRecentApp(app) {
            try {
                let recent = getRecentApps();

                // Remove if already exists
                recent = recent.filter(item => item.path !== app.path);

                // Add to beginning with timestamp
                recent.unshift({
                    ...app,
                    timestamp: Date.now()
                });

                // Keep only MAX_RECENT_APPS
                recent = recent.slice(0, MAX_RECENT_APPS);

                localStorage.setItem(RECENT_APPS_KEY, JSON.stringify(recent));
                renderRecentApps();
            } catch (e) {
                console.error('Error saving recent app:', e);
            }
        }

        function clearRecentApps() {
            try {
                localStorage.removeItem(RECENT_APPS_KEY);
                renderRecentApps();
            } catch (e) {
                console.error('Error clearing recent apps:', e);
            }
        }

        function getTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return `${Math.floor(seconds / 604800)}w ago`;
        }

        function renderRecentApps() {
            const recent = getRecentApps();

            if (recent.length === 0) {
                recentAppsSection.style.display = 'none';
                return;
            }

            recentAppsSection.style.display = 'block';
            recentAppsGrid.innerHTML = '';

            recent.forEach(app => {
                const card = document.createElement('a');
                card.className = 'recent-app-card';
                card.href = app.path;
                card.innerHTML = `
                    <div class="recent-app-icon">${app.icon}</div>
                    <div class="recent-app-info">
                        <div class="recent-app-name">${app.name}</div>
                        <div class="recent-app-time">${getTimeAgo(app.timestamp)}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    saveRecentApp(app);
                });

                recentAppsGrid.appendChild(card);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            if (confirm('Clear all recent apps history?')) {
                clearRecentApps();
            }
        });

        function renderApps(filteredApps = apps) {
            categoriesContainer.innerHTML = '';

            if (filteredApps.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            const categories = {};
            filteredApps.forEach(app => {
                if (!categories[app.category]) {
                    categories[app.category] = [];
                }
                categories[app.category].push(app);
            });

            Object.keys(categories).sort().forEach(category => {
                const section = document.createElement('div');
                section.className = 'category-section fade-in';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <h2 class="category-title">${category}</h2>
                    <span class="category-count">(${categories[category].length})</span>
                `;

                const grid = document.createElement('div');
                grid.className = 'links-grid';

                categories[category].forEach(app => {
                    const card = document.createElement('a');
                    card.className = 'link-card';
                    card.href = app.path;
                    card.innerHTML = `
                        <div class="link-icon">${app.icon}</div>
                        <div class="link-title">${app.name}</div>
                        <div class="link-description">${app.description}</div>
                    `;

                    // Track click for recent apps
                    card.addEventListener('click', () => {
                        saveRecentApp(app);
                    });

                    grid.appendChild(card);
                });

                section.appendChild(header);
                section.appendChild(grid);
                categoriesContainer.appendChild(section);
            });

            // Update stats
            totalAppsEl.textContent = filteredApps.length;
            categoriesEl.textContent = Object.keys(categories).length;
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = apps.filter(app =>
                app.name.toLowerCase().includes(searchTerm) ||
                app.description.toLowerCase().includes(searchTerm) ||
                app.category.toLowerCase().includes(searchTerm)
            );
            renderApps(filtered);
        });

        // Initial render
        renderApps();
        renderRecentApps();
    </script>
</body>

</html>
