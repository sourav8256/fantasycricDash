<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sapience Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .dot-filled {
            background: linear-gradient(135deg, #6366f1, #a855f7); /* Indigo to Purple */
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            transform: scale(1.1);
        }

        .dot-empty {
            background: rgba(51, 65, 85, 0.5); /* Slate 700ish */
            border: 2px solid rgba(71, 85, 105, 0.5);
        }

        .pulse-active {
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(99, 102, 241, 0.5); }
            50% { border-color: rgba(99, 102, 241, 1); }
            100% { border-color: rgba(99, 102, 241, 0.5); }
        }

        .timer-glow {
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0f172a] text-slate-50">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center relative z-20">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="text-indigo-500"><i class="fa-solid fa-brain"></i></span>
                Sapience
            </h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Focus Block Tracker</p>
        </div>
        <button onclick="toggleSettings(true)" class="p-3 rounded-full hover:bg-slate-800 transition-colors btn-press">
            <i class="fa-solid fa-gear text-slate-400 text-xl"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center px-6 py-8">
        
        <!-- Large Timer Display -->
        <div class="mb-12 text-center">
            <div id="timerDisplay" class="text-7xl font-light tracking-tighter timer-glow mb-8 tabular-nums">0:00</div>
            <div class="flex items-center justify-center gap-4">
                <button id="mainActionBtn" onclick="toggleTimer()" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-10 py-4 rounded-full font-semibold transition-all shadow-lg shadow-indigo-500/20 btn-press flex items-center gap-2">
                    <i id="playIcon" class="fa-solid fa-play"></i>
                    <span id="playText">Start Focus</span>
                </button>
                <button onclick="resetBlock()" 
                    class="w-14 h-14 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center transition-colors btn-press"
                    title="Reset Current Block">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- Dots Grid Container -->
        <div id="dotsContainer" class="w-full max-w-lg grid grid-cols-6 sm:grid-cols-10 gap-2 sm:gap-3 pb-12">
            <!-- Dots will be injected here -->
        </div>

    </main>

    <!-- Bottom Controls (Now Relative) -->
    <footer class="p-8 pb-12 mt-auto flex justify-center items-center gap-6 glass rounded-t-[2.5rem] relative">
        <button onclick="adjustDots(-1)" class="w-14 h-14 rounded-full glass flex items-center justify-center text-xl text-slate-300 hover:text-white transition-colors btn-press">
            <i class="fa-solid fa-minus"></i>
        </button>
        
        <div class="text-center min-w-[120px]">
            <span id="filledCount" class="text-2xl font-bold text-indigo-400">0</span>
            <span class="text-slate-500 mx-1">/</span>
            <span id="totalCountDisplay" class="text-slate-400 font-medium">32</span>
            <p class="text-[10px] uppercase tracking-widest text-slate-500 mt-1">Dots Filled</p>
        </div>

        <button onclick="adjustDots(1)" class="w-14 h-14 rounded-full glass flex items-center justify-center text-xl text-slate-300 hover:text-white transition-colors btn-press">
            <i class="fa-solid fa-plus"></i>
        </button>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onclick="toggleSettings(false)"></div>
        <div class="relative glass rounded-[2rem] p-8 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-6">Settings</h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Total Daily Dots</label>
                    <div class="flex items-center gap-4">
                        <input type="number" id="totalDotsInput" 
                            class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 w-full focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-lg"
                            min="1" max="96" value="32">
                        <span class="text-xs text-slate-500 font-medium whitespace-nowrap">(max 96)</span>
                    </div>
                </div>

                <div class="pt-4 flex gap-4">
                    <button onclick="toggleSettings(false)" class="flex-1 py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 font-semibold transition-colors btn-press">
                        Cancel
                    </button>
                    <button onclick="saveSettings()" class="flex-1 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 font-semibold transition-colors btn-press">
                        Save
                    </button>
                </div>

                <button onclick="resetAll()" class="w-full py-3 text-red-400 text-sm font-medium hover:text-red-300 transition-colors">
                    Reset All Progress
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Sound (Dummy) -->
    <audio id="completionSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- State Management ---
        const INTERVAL_DURATION = 15 * 60; // 15 mins in seconds
        
        let state = {
            totalDots: 32,
            filledDots: 0,
            elapsedSeconds: 0, // Changed from timerSeconds (countdown) to elapsedSeconds (incremental)
            isRunning: false,
            lastTickTimestamp: null
        };

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem('sapience_state');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                
                // If it was running, calculate time elapsed while page was closed
                if (state.isRunning && state.lastTickTimestamp) {
                    const now = Date.now();
                    const secondsPassed = Math.floor((now - state.lastTickTimestamp) / 1000);
                    
                    // Add the passed time to our count
                    state.elapsedSeconds += secondsPassed;
                    
                    // Handle overflow (if multiple dots were completed while away)
                    while (state.elapsedSeconds >= INTERVAL_DURATION) {
                        state.filledDots++;
                        state.elapsedSeconds -= INTERVAL_DURATION;
                        
                        if (state.filledDots >= state.totalDots) {
                            state.filledDots = state.totalDots;
                            state.elapsedSeconds = 0;
                            state.isRunning = false;
                            break;
                        }
                    }
                    
                    // Resume the timer
                    if (state.isRunning) {
                        startTimer();
                    }
                }
            }
        }

        function saveState() {
            localStorage.setItem('sapience_state', JSON.stringify(state));
        }

        // --- Timer Logic ---
        let timerInterval = null;

        function toggleTimer() {
            if (state.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            state.isRunning = true;
            state.lastTickTimestamp = Date.now();
            updateUI();
            
            // Clear any existing interval to prevent double-speed
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const now = Date.now();
                const delta = Math.floor((now - state.lastTickTimestamp) / 1000);
                
                if (delta >= 1) {
                    state.elapsedSeconds += delta;
                    state.lastTickTimestamp = now;

                    if (state.elapsedSeconds >= INTERVAL_DURATION) {
                        completeInterval();
                    }
                    updateUI();
                    saveState();
                }
            }, 1000);
        }

        function pauseTimer() {
            state.isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            updateUI();
            saveState();
        }

        function completeInterval() {
            state.filledDots++;
            state.elapsedSeconds = 0; // Reset to 0 for next incremental block
            
            // Visual feedback
            triggerNotification();
            
            // Limit to total
            if (state.filledDots >= state.totalDots) {
                state.filledDots = state.totalDots;
                pauseTimer(); // Stop if all dots done
            }
        }

        function triggerNotification() {
            // Sound
            const sound = document.getElementById('completionSound');
            sound.play().catch(e => console.log('Audio play blocked'));

            // Vibrate if mobile
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            // Visual flash
            const body = document.body;
            body.classList.add('bg-indigo-900');
            setTimeout(() => body.classList.remove('bg-indigo-900'), 500);
        }

        // --- Manual Adjustments ---
        function adjustDots(amount) {
            state.filledDots = Math.max(0, Math.min(state.totalDots, state.filledDots + amount));
            updateUI();
            saveState();
        }

        // --- Settings ---
        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            document.getElementById('totalDotsInput').value = state.totalDots;
            modal.classList.toggle('hidden', !show);
        }

        function saveSettings() {
            const input = document.getElementById('totalDotsInput');
            const newTotal = parseInt(input.value);
            if (newTotal > 0 && newTotal <= 96) {
                state.totalDots = newTotal;
                state.filledDots = Math.min(state.filledDots, state.totalDots);
                // Ensure elapsedSeconds is reset if we adjusted dots manually or if it was at limit
                if (state.filledDots >= state.totalDots) {
                    state.elapsedSeconds = 0;
                }
                updateUI();
                saveState();
                toggleSettings(false);
            }
        }

        function resetBlock() {
            // No confirmation needed for just the block reset usually, but let's just do it
            state.elapsedSeconds = 0;
            state.isRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            updateUI();
            saveState();
        }

        function resetAll() {
            if (confirm('Reset all progress for today?')) {
                state.filledDots = 0;
                state.elapsedSeconds = 0;
                state.isRunning = false;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
                updateUI();
                saveState();
                toggleSettings(false);
            }
        }

        // --- UI Rendering ---
        function updateUI() {
            // Calculate Total Accumulated Time
            const totalSeconds = (state.filledDots * INTERVAL_DURATION) + state.elapsedSeconds;
            
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            
            // Format: H:MM:SS (only show hours if > 0)
            let displayTime = "";
            if (hrs > 0) {
                displayTime = `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                displayTime = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            document.getElementById('timerDisplay').textContent = displayTime;
            
            // Update Tab Title for focus
            document.title = (state.isRunning ? "▶ " : "") + displayTime + " - Sapience";
            
            // Buttons
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            if (state.isRunning) {
                playIcon.className = 'fa-solid fa-pause';
                playText.textContent = 'Pause Focus';
            } else {
                playIcon.className = 'fa-solid fa-play';
                playText.textContent = state.elapsedSeconds > 0 ? 'Resume' : 'Start Focus';
            }

            // Stats
            document.getElementById('filledCount').textContent = state.filledDots;
            document.getElementById('totalCountDisplay').textContent = state.totalDots;

            // Render Dots
            renderDots();
        }

        function renderDots() {
            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            
            for (let i = 1; i <= state.totalDots; i++) {
                const dot = document.createElement('div');
                dot.className = 'aspect-square rounded-full dot';
                
                if (i <= state.filledDots) {
                    dot.classList.add('dot-filled');
                } else {
                    dot.classList.add('dot-empty');
                    // Pulse the NEXT dot if running
                    if (i === state.filledDots + 1 && state.isRunning) {
                        dot.classList.add('pulse-active');
                    }
                }
                
                container.appendChild(dot);
            }
        }

        // --- Init ---
        loadState();
        updateUI();

    </script>
</body>
</html>
